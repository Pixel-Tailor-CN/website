name: Build and Deploy
on:
  push:
    branches:
      - main
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup PNPM
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Build project
        run: pnpm run build
      # 国内站产物只有赞助配置里的收款码地址不同，改用国内域名
      - name: Build mainland variant
        env:
          SUPPORT_ORIGIN: https://pixel.mystery0.vip
        run: pnpm exec astro build --outDir dist-mainland
      # DNS 切到 EdgeOne 之前保留 GitHub Pages 部署，切换完成后删除以下两步和 CNAME 文件
      - name: Copy custom domain
        run: cp CNAME ./dist/CNAME
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
      - name: Deploy to EdgeOne Pages
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: |
          cp edgeone.json ./dist/edgeone.json
          # 国际站产物额外带上中间件；CLI 从当前目录编译中间件，所以进入各自目录再部署
          cp -r dist dist-intl
          cp middleware.js ./dist-intl/middleware.js
          # 国际站 pixel.mystery0.app：不含中国大陆的加速区域
          (cd dist-intl && npx --yes edgeone@latest makers deploy . \
            -n pixel-tailor-cn \
            -t "$EDGEONE_API_TOKEN" \
            --site china \
            -a overseas)
          # 国内站 pixel.mystery0.vip：含中国大陆的加速区域，不带中间件
          cp edgeone.json ./dist-mainland/edgeone.json
          (cd dist-mainland && npx --yes edgeone@latest makers deploy . \
            -n pixel-tailor-cn-mainland \
            -t "$EDGEONE_API_TOKEN" \
            --site china \
            -a global)
